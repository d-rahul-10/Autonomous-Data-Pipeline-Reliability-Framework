<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d14">
  <meta name="description" content="Sign in to PipelineIQ — Pipeline reliability dashboard">
  <title>Sign In — PipelineIQ</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='cyberpunk.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="auth-shell">
    <main class="auth-main" id="main-content" role="main">
      <div class="auth-card">
        <header class="auth-header">
          <a class="auth-brand" href="/" aria-label="PipelineIQ home">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <path d="M5 22.5h5.5l3.2-13 4.6 17 3.1-11h5.6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="5" cy="22.5" r="2" fill="currentColor"/>
                <circle cx="27" cy="15.5" r="2" fill="currentColor"/>
              </svg>
            </span>
            <span class="brand-name">Pipeline<span>IQ</span></span>
          </a>
          <h1>Welcome back</h1>
          <p class="auth-subtitle">Sign in to monitor your pipeline health</p>
        </header>

        <div class="auth-alert" id="auth-alert" role="alert" hidden>
          <span class="alert-icon" aria-hidden="true">!</span>
          <span id="alert-message"></span>
        </div>

        <form class="auth-form" id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email address</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
                <path d="M22 6l-10 7L2 6"/>
              </svg>
              <input type="email" id="email" name="email" autocomplete="email" required
                     placeholder="you@example.com" aria-describedby="email-error">
            </div>
            <span class="form-error" id="email-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <div class="form-group-header">
              <label for="password">Password</label>
              <a href="#forgot" class="forgot-link" id="forgot-link">Forgot password?</a>
            </div>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="password" name="password" autocomplete="current-password" required
                     placeholder="••••••••" aria-describedby="password-error">
              <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span class="form-error" id="password-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label class="checkbox-wrapper">
              <input type="checkbox" name="remember" id="remember">
              <span class="checkbox-custom"></span>
              <span>Remember me</span>
            </label>
          </div>

          <button type="submit" class="button button-primary button-block" id="submit-btn">
            <span class="btn-text">Sign in</span>
            <span class="btn-loader" hidden>
              <svg class="spinner" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="30 60" stroke-linecap="round"/></svg>
            </span>
          </button>
        </form>

        <footer class="auth-footer">
          <p>Don't have an account? <a href="{{ url_for('signup_page') }}">Create one</a></p>
        </footer>
      </div>

      <div class="auth-bg" aria-hidden="true">
        <div class="bg-grid"></div>
        <div class="bg-glow glow-1"></div>
        <div class="bg-glow glow-2"></div>
        <div class="bg-glow glow-3"></div>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='vendor/gsap.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
</body>
</html>
